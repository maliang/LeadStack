<!doctype html>
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="LeadStack 领栈 · 多服务器部署与检测控制台" />
    <title>LeadStack 领栈 · 控制台</title>
    <script>
      // 首屏前应用主题，避免深色模式闪白；默认浅色。
      (function () {
        try {
          if (localStorage.getItem('leadstack_theme') === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* localStorage 不可用时忽略 */
        }
      })()
    </script>
  </head>
  <body
    class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100"
  >
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
