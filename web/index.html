<!doctype html>
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="LeadStack 领栈 · 多服务器部署与检测控制台" />
    <title>LeadStack 领栈 · 控制台</title>
    <script>
      // 首屏前应用主题/主题色/字号/密度/语言，避免闪烁与错版。
      (function () {
        try {
          var ls = window.localStorage
          var themeMode = ls.getItem('leadstack.theme') || 'system'
          var dark =
            themeMode === 'dark' ||
            (themeMode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', !!dark)
          root.dataset.themeMode = themeMode
          root.dataset.theme = dark ? 'dark' : 'light'
          root.dataset.accent = ls.getItem('leadstack.accent') || 'green'
          root.dataset.density = ls.getItem('leadstack.density') || 'comfortable'
          var size = ls.getItem('leadstack.fontSize') || 'normal'
          var sizes = { small: '14px', normal: '16px', large: '18px' }
          root.dataset.fontSize = size
          root.style.fontSize = sizes[size] || '16px'
          var lang = ls.getItem('leadstack.lang') || 'zh-CN'
          root.setAttribute('lang', lang === 'en-US' ? 'en' : 'zh-CN')
        } catch (e) {
          /* localStorage 不可用时忽略 */
        }
      })()
    </script>
  </head>
  <body
    class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100"
  >
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
