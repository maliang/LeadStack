<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LeadStack 领栈">
  <defs>
    <linearGradient id="ls-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#ls-tile)"/>
  <!-- 白色 L 形框架：「领」(Lead) 与 LeadStack 首字母，开口朝前 -->
  <path d="M17 11 V45 H52" fill="none" stroke="#ffffff" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 脉冲折线：栈上跑着的检测与健康（与「在线」同色） -->
  <path d="M26 33 L32 33 L36 21 L42 38 L46 27 L52 27" fill="none" stroke="#34d399" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
