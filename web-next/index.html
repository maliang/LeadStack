<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="LeadStack 领栈 · 多服务器部署与检测控制台" />
    <title>LeadStack 领栈 · 控制台</title>
    <!--
      首屏防闪：在样式与入口脚本之前同步读取持久化外观。
      键名 `__VEAN_THEME` 与 @vean/ui 0.51.5 的 THEME_STORAGE_KEY 一致（见 src/lib/appearance.ts）；
      envelope 里的 style 是该 provider 写出的 `#vean-theme` 快照，提前注入可避免变量缺失闪白，
      provider 挂载后会复用同一个 style 元素并覆盖为最新值。
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        var mode = 'auto'
        var density = 'standard'
        var style = ''
        var language = ''
        try {
          language = window.localStorage.getItem('leadstack.lang') || ''
          var raw = window.localStorage.getItem('__VEAN_THEME')
          if (raw) {
            var saved = JSON.parse(raw)
            if (saved && (saved.mode === 'auto' || saved.mode === 'light' || saved.mode === 'dark')) {
              mode = saved.mode
            }
            if (saved && saved.extra && (saved.extra.density === 'compact' || saved.extra.density === 'standard')) {
              density = saved.extra.density
            }
            if (saved && typeof saved.style === 'string') style = saved.style
          }
        } catch (error) {
          /* localStorage 被禁用时退回默认外观 */
        }
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = mode === 'dark' || (mode === 'auto' && prefersDark)
        if (dark) root.classList.add('dark')
        root.style.colorScheme = dark ? 'dark' : 'light'
        root.setAttribute('data-density', density)
        if (language === 'zh-CN' || language === 'en-US') {
          root.setAttribute('lang', language === 'en-US' ? 'en' : 'zh-CN')
        }
        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) themeColor.setAttribute('content', dark ? '#0b1220' : '#f8fafc')
        if (style) {
          var tag = document.createElement('style')
          tag.id = 'vean-theme'
          tag.textContent = style
          document.head.appendChild(tag)
        }
      })()
    </script>
    <!--
      冷启动骨架样式（S2 慢网白屏）：只服务首帧占位，不属于组件样式表，主样式仍只在 src/styles/main.css。
      放在 index.html 内联的原因：慢网下样式包本身也可能迟到，骨架必须与 HTML 同批上屏（零 JS、零额外请求）。
      颜色只引用 --ls-* token 并带首帧兜底值；320px 窄宽靠 flex-wrap 折行，不产生横向溢出或裁切。
    -->
    <style>
      .ls-boot-skeleton {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 0.75rem;
        min-height: 100vh;
        padding: 0.75rem;
        background: var(--ls-bg, #f8fafc);
      }
      .ls-boot-skeleton__rail {
        display: block;
        flex: 0 0 10rem;
        align-self: stretch;
        min-height: 14rem;
        border: 1px solid var(--ls-border, #e2e8f0);
        border-radius: 0.625rem;
        background: var(--ls-surface, #ffffff);
      }
      .ls-boot-skeleton__main {
        display: flex;
        flex: 1 1 14rem;
        flex-direction: column;
        gap: 0.75rem;
        min-width: 0;
      }
      .ls-boot-skeleton__bar {
        display: block;
        border-radius: 0.5rem;
        background: var(--ls-border, #e2e8f0);
      }
      .ls-boot-skeleton__bar--head {
        height: 3.5rem;
      }
      .ls-boot-skeleton__bar--panel {
        height: 7rem;
      }
      .ls-boot-skeleton__bar--row {
        height: 1.25rem;
      }
      .ls-boot-skeleton__bar--row-short {
        width: 60%;
        height: 1.25rem;
      }
    </style>
  </head>
  <body>
    <!--
      S2：bootstrap() 要先 await 词典 chunk 才 mount，慢网下 #app 会空窗数秒（q3 实测 3.55s）。
      这里把骨架静态写进 #app：首字节到达即可上屏，zh / en 都复用同一块，不新增 i18n 键。
      Vue 的 runtime-dom 在 app.mount() 开头会执行 container.innerHTML = ''，挂载后骨架自然消失，不会残留。
      文案约束：骨架内不得出现任何中英文文案（只放 aria-hidden 的纯几何块），否则切换语言会二次闪烁。
    -->
    <div id="app">
      <div class="ls-boot-skeleton" aria-hidden="true">
        <span class="ls-boot-skeleton__rail"></span>
        <div class="ls-boot-skeleton__main">
          <span class="ls-boot-skeleton__bar ls-boot-skeleton__bar--head"></span>
          <span class="ls-boot-skeleton__bar ls-boot-skeleton__bar--panel"></span>
          <span class="ls-boot-skeleton__bar ls-boot-skeleton__bar--row"></span>
          <span class="ls-boot-skeleton__bar ls-boot-skeleton__bar--row"></span>
          <span class="ls-boot-skeleton__bar ls-boot-skeleton__bar--row-short"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
