# LeadStack CI（[devops]）
#
#   push / PR  -> jq 就绪 -> vet + **gofmt 闸门** + build + test + **go test -race（api/store）**
#                 + 脚本语法/干跑校验 + make build + make devssh
#                 -> 基础/纳管/检测/告警 端到端验收（阻塞）+ 部署 端到端验收（稳定前允许失败）
#                 -> 备份/恢复验收（稳定前允许失败）
#                 -> 运维验收 verify_ops.sh（运维与协作 能力，稳定前允许失败）
#                 -> docker 构建（前端工程就绪后）
#                 -> goreleaser 快照构建（验证发布配置与 5 平台 × 2 二进制，不发布）
#
# 发布职责边界（重要）：
#   本文件 = 质量门禁 + 发布配置验证；
#   release-auto.yml = 主分支提交 → 版本推导 → tag → 真正的 goreleaser 发布。
#   不要把「建 tag / 发 Release」写回本文件，否则会与自动发版重复发布。
#   tag v*     -> 本文件不再发布 Release（tag 发布统一由 release-auto.yml 负责，避免双发布）
#
# 两道硬闸门（告警 新增）：
#   1) `make fmt-check`：gofmt -l 必须为空（本仓库多次出现格式漂移）
#   2) `make test-race`：go test -race 覆盖 internal/api 与 internal/store（告警并发状态机）
#
# Go 版本：两个 job 都用 `go-version-file: go.mod` 读取模块的 go 指令（当前 go 1.27.2），
#   不写死版本，避免 runner 工具链比 go.mod 旧时直接报 "go.mod requires go >= 1.27.2"。
#
# 验收脚本（scripts/verify_bootstrap.sh、verify_servers.sh、verify_checks.sh，Lead 所有）依赖 jq，
# 失败时控制端/agent 日志与脚本输出会作为 artifact 上传（.e2e-logs/）。
#
# TODO(macOS 公证 / Windows 签名)：
#   目前没有 Apple Developer ID 证书与 Windows EV 代码签名证书，因此 release job
#   不使用 goreleaser 的 notarize / signs 段（.goreleaser.yaml 中保持注释）。
#   凭据就绪后：1) 取消 .goreleaser.yaml 里对应段落注释；
#               2) 在仓库 Secrets 配置
#                  APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
#                  或 APPLE_KEY_ID / APPLE_ISSUER_ID / APPLE_KEY_P8
#                  WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD
#               3) 在下面的 release job 里用 env 注入这些 secrets。
#   在此之前，发布产物是未签名的 tar.gz/zip，CI 必须保持绿色。

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) 编译 + 测试 + 脚本自检
  # ---------------------------------------------------------------------------
  build-test:
    name: vet / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # 直接读 go.mod 的 go 指令（go 1.27.2），保证与模块要求绝不漂移。
          # 不要写死 "1.27.x" 之外的更旧版本：go.mod 要求 1.27.2，
          # 低于它的工具链会报 "go.mod requires go >= 1.27.2"。
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 显示工具链版本
        run: |
          go version
          node -v
          pnpm -v

      - name: 确保 jq 可用（验收脚本依赖）
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          jq --version

      - name: go vet
        run: go vet ./...

      - name: gofmt 闸门（有未格式化文件即失败）
        run: make fmt-check

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test -race（闸门：internal/api 与 internal/store）
        # 并发面最大的两个包（告警 告警状态机在 api）；-count=1 避免命中缓存
        run: make test-race

      - name: 部署脚本语法检查（sh / dash / bash）
        run: |
          sh -n deploy/install.sh
          dash -n deploy/install.sh
          bash -n deploy/install.sh

      - name: install.sh dry-run 冒烟（不得改动系统）
        run: |
          sh deploy/install.sh --dry-run --server http://127.0.0.1:8080 --token ci-dummy-token
          sh deploy/install.sh --uninstall --dry-run --install-dir "$RUNNER_TEMP/bin" --env-dir "$RUNNER_TEMP/env"

      - name: make build（一条命令出两个二进制 + 内嵌 UI）
        run: make build

      - name: make devssh（DEV-ONLY 测试 SSH 端点，供 纳管 验收）
        run: make devssh

      - name: 校验产物存在
        run: |
          test -x bin/leadstack
          test -x bin/leadstack-agent
          test -x bin/leadstack-devssh
          ls -lh bin/

      - uses: actions/upload-artifact@v4
        with:
          name: leadstack-bin-${{ github.sha }}
          path: bin/
          if-no-files-found: error
          retention-days: 7

      # ---- 端到端验收（基础/纳管/检测/告警 阻塞；部署 初期允许失败）----
      # 日志：脚本内部会把控制端/agent 日志尾部打到 stdout，这里 tee 到 .e2e-logs/；
      # 同时把 TMPDIR 指到该目录，脚本异常中止时残留的 leadstack*.log 也会被 artifact 收走。
      - name: 基础 端到端验收（阻塞）
        id: e2e_m0
        shell: bash
        run: |
          mkdir -p .e2e-logs
          TMPDIR="$PWD/.e2e-logs" bash scripts/verify_bootstrap.sh 2>&1 | tee .e2e-logs/verify_bootstrap.log
          exit "${PIPESTATUS[0]}"

      - name: 纳管 端到端验收（阻塞，已双验收稳定）
        id: e2e_m1
        shell: bash
        run: |
          mkdir -p .e2e-logs
          if [ ! -f scripts/verify_servers.sh ]; then
            echo "scripts/verify_servers.sh 尚未就绪，跳过服务器纳管验收"
            exit 0
          fi
          TMPDIR="$PWD/.e2e-logs" bash scripts/verify_servers.sh 2>&1 | tee .e2e-logs/verify_servers.log
          exit "${PIPESTATUS[0]}"

      - name: 检测 端到端验收（阻塞，已 25/25 稳定）
        id: e2e_m2
        shell: bash
        run: |
          mkdir -p .e2e-logs
          if [ ! -f scripts/verify_checks.sh ]; then
            echo "scripts/verify_checks.sh 尚未就绪，跳过监控检测验收"
            exit 0
          fi
          TMPDIR="$PWD/.e2e-logs" bash scripts/verify_checks.sh 2>&1 | tee .e2e-logs/verify_checks.log
          exit "${PIPESTATUS[0]}"

      - name: 告警 端到端验收（阻塞，已 29/29 稳定）
        id: e2e_m3
        shell: bash
        run: |
          mkdir -p .e2e-logs
          if [ ! -f scripts/verify_alerts.sh ]; then
            echo "scripts/verify_alerts.sh 尚未就绪，跳过告警验收"
            exit 0
          fi
          TMPDIR="$PWD/.e2e-logs" bash scripts/verify_alerts.sh 2>&1 | tee .e2e-logs/verify_alerts.log
          exit "${PIPESTATUS[0]}"

      - name: 部署 端到端验收（稳定前允许失败）
        id: e2e_m4
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .e2e-logs
          if [ ! -f scripts/verify_deploy.sh ]; then
            echo "scripts/verify_deploy.sh 尚未就绪，跳过部署验收"
            exit 0
          fi
          TMPDIR="$PWD/.e2e-logs" bash scripts/verify_deploy.sh 2>&1 | tee .e2e-logs/verify_deploy.log
          exit "${PIPESTATUS[0]}"

      - name: 备份/恢复验收（稳定前允许失败）
        id: e2e_backup
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .e2e-logs
          if [ ! -f scripts/verify_backup.sh ]; then
            echo "scripts/verify_backup.sh 尚未就绪，跳过备份验收"
            exit 0
          fi
          # 备份验收会自己起停控制端并用 CLI 做离线恢复，仍需 TMPDIR 落在 workspace 便于取证
          TMPDIR="$PWD/.e2e-logs" bash scripts/verify_backup.sh 2>&1 | tee .e2e-logs/verify_backup.log
          exit "${PIPESTATUS[0]}"

      - name: 运维与协作 运维能力验收（terminal/文件/cron/审计/RBAC，稳定前允许失败）
        id: e2e_ops
        continue-on-error: true
        # verify_ops.sh 会跑真实终端 WS、文件落盘、cron tick 与 agent 升级，比其它脚本慢得多
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p .e2e-logs
          if [ ! -f scripts/verify_ops.sh ]; then
            echo "scripts/verify_ops.sh 尚未就绪，跳过运维验收"
            exit 0
          fi
          # verify_ops.sh 用 python3 实现最小 WebSocket 客户端；runner 自带，缺失则兜底安装
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 缺失，安装中…"
            sudo apt-get update && sudo apt-get install -y python3
          fi
          python3 --version
          # verify_ops.sh 会自建数据目录、起停控制端并驱动 devssh，日志同样落 .e2e-logs/
          TMPDIR="$PWD/.e2e-logs" bash scripts/verify_ops.sh 2>&1 | tee .e2e-logs/verify_ops.log
          exit "${PIPESTATUS[0]}"

      - name: 上传 e2e 日志（任一 e2e 失败时）
        # 注意：continue-on-error 的步骤不会让 job 变成 failure，
        # 所以必须用 steps.<id>.outcome 兜住 部署 / 备份 / 运维验收，否则它们的日志会丢。
        if: failure() || steps.e2e_m4.outcome == 'failure' || steps.e2e_backup.outcome == 'failure' || steps.e2e_ops.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.sha }}
          path: |
            .e2e-logs/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2) 容器镜像构建（前端工程落地后才跑）
  # ---------------------------------------------------------------------------
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 前端工程是否就绪
        id: web
        run: |
          if [ -f web/package.json ]; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
            echo "web/package.json 不存在，跳过镜像构建"
          fi

      - name: 准备 Buildx
        if: steps.web.outputs.exists == '1'
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送）
        if: steps.web.outputs.exists == '1'
        run: docker build -t leadstack:ci .

  # ---------------------------------------------------------------------------
  # 3) 发布配置验证：goreleaser 快照构建（PR 上就暴露 .goreleaser.yaml 问题）
  # ---------------------------------------------------------------------------
  release-snapshot:
    name: goreleaser 快照构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 前端构建（UI 内嵌前置；失败归属前端，不算发布配置问题）
        # 单独成步：前端 tsc/vite 挂掉时，失败结论清楚写在「前端构建」这一步，
        # 不会和「goreleaser 配置/交叉编译」的失败混在一起。
        id: web_build
        run: make web-embed

      - name: goreleaser 配置校验
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      # before.hooks 仍会跑 `make web-embed`（幂等，约 2–3 秒）：
      # 保留它是为了和 `make release-snapshot` / 正式发布完全同一条路径。
      - name: goreleaser build --snapshot --clean
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean

      - name: 断言 5 平台 × 2 二进制（且不含 DEV-ONLY devssh）
        shell: bash
        run: |
          set -euo pipefail
          echo "dist 中的可执行产物："
          find dist -type f \( -name 'leadstack' -o -name 'leadstack-agent' \
            -o -name 'leadstack.exe' -o -name 'leadstack-agent.exe' \) | sort
          count="$(find dist -type f \( -name 'leadstack' -o -name 'leadstack-agent' \
            -o -name 'leadstack.exe' -o -name 'leadstack-agent.exe' \) | wc -l | tr -d ' ')"
          echo "二进制数量：${count}（期望 10）"
          if [ "${count}" != "10" ]; then
            echo "::error::goreleaser 产物数量异常：${count} != 10"
            exit 1
          fi
          if find dist -type f -name '*devssh*' | grep -q .; then
            echo "::error::DEV-ONLY devssh 出现在发布产物中"
            exit 1
          fi
          echo "断言通过：10 个发布二进制，且无 devssh"
