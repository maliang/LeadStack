<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LeadStack 领栈">
  <defs>
    <linearGradient id="ls-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <!-- 顶部高光：给深色方块一点「玻璃质感」，避免扁平 -->
    <linearGradient id="ls-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".65" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#ls-tile)"/>
  <rect width="64" height="64" rx="17" fill="url(#ls-sheen)"/>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="16.5" fill="none"
        stroke="#ffffff" stroke-opacity=".16" stroke-width="1.2"/>
  <!-- 白色 L 形框架：「领」(Lead) 与 LeadStack 首字母，开口朝前 -->
  <path d="M17 11 V45 H52" fill="none" stroke="#ffffff" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 薄荷色脉冲折线：栈上跑着的检测与健康信号 -->
  <path d="M26 33 L32 33 L36 21 L42 38 L46 27 L52 27" fill="none" stroke="#ecfdf5" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
